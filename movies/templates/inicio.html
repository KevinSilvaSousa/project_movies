<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>

    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: red;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filme {
            background-color: #222;
            width: 220px;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .filme:hover {
            transform: scale(1.05);
        }

        .filme img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .info {
            padding: 10px;
        }

        .info h2 {
            margin: 0;
            font-size: 20px;
        }

        .info p {
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>Catálogo de Filmes</h1>

    <div class="container">

        <div class="filme">
            <img src="https://picsum.photos/300/400?1" alt="Filme">
            
            <div class="info">
                <h2>Batman</h2>
                <p>Ação • 2022</p>
            </div>
        </div>

        <div class="filme">
            <img src="https://picsum.photos/300/400?2" alt="Filme">
            
            <div class="info">
                <h2>Interestelar</h2>
                <p>Ficção • 2014</p>
            </div>
        </div>

        <div class="filme">
            <img src="https://picsum.photos/300/400?3" alt="Filme">
            
            <div class="info">
                <h2>Vingadores</h2>
                <p>Aventura • 2019</p>
            </div>
        </div>

    </div>

</body>
</html>
